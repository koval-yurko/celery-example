# Contract: SonarQube Project Properties
# Feature: 004-sonarqube-pipeline
# Description: SonarCloud project configuration file for monorepo
#
# This is a CONTRACT file - it defines the expected structure and configuration
# for the actual implementation file at repository root: sonar-project.properties
#
# NOTE: Replace <organization-key> with your actual SonarCloud organization key

# Required: Project identification
sonar.projectKey=celery-example
sonar.organization=<organization-key>

# Optional: Project metadata
sonar.projectName=Celery Example
sonar.projectVersion=1.0

# Source configuration for monorepo
# Each package has its source in src/ subdirectory
sonar.sources=common/src,api-gateway/src,example-service-1/src,example-service-2/src,worker/src
sonar.sourceEncoding=UTF-8

# Python-specific configuration
sonar.python.version=3.11

# Exclusions (non-source files)
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/venv/**,**/*.pyc,**/migrations/**,**/.git/**,**/.specify/**

# Test configuration for monorepo
sonar.tests=common/tests,api-gateway/tests,example-service-1/tests,example-service-2/tests,worker/tests
sonar.test.inclusions=**/test_*.py,**/*_test.py

# Coverage report location (generated by pytest-cov with multiple --cov flags)
sonar.python.coverage.reportPaths=coverage.xml

# SonarCloud Project Configuration
# Feature: 004-sonarqube-pipeline

# Required: Project identification
sonar.projectKey=celery-example
sonar.organization=YOUR_ORGANIZATION_KEY

# Optional: Project metadata
sonar.projectName=Celery Example
sonar.projectVersion=1.0

# Source configuration
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Python-specific configuration
sonar.python.version=3.11

# Exclusions (non-source files)
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/venv/**,**/*.pyc,**/migrations/**,**/.git/**

# Test configuration
sonar.tests=tests
sonar.test.inclusions=**/test_*.py,**/*_test.py

# Coverage report location (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml
